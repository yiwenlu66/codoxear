<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1072" height="490" viewBox="0 0 1072 490" role="img" aria-labelledby="title desc">
  <title id="title">B Tinted Paper compared with the requested reference-weight combination</title>
  <desc id="desc">Side-by-side 180-pixel inspection and 60-pixel home-screen samples. The requested combination keeps B's palette and geometry while using the original Paper Outline's 24-pixel line weight.</desc>
  <rect width="1072" height="490" fill="#f6f5f1"/>
  <text x="36" y="48" fill="#2f2b26" font-family="sans-serif" font-size="28" font-weight="700">Codoxear logo — requested combination</text>
  <text x="36" y="76" fill="#6b6862" font-family="sans-serif" font-size="16">B geometry + palette · original Paper Outline's heavier 24px line treatment</text>
  <g transform="translate(36 104)">
    <rect width="488" height="350" rx="20" fill="#fffdf9" stroke="#d9d0be" stroke-width="2"/>
    <text x="24" y="38" fill="#2f2b26" font-family="sans-serif" font-size="19" font-weight="700">B original · Tinted Paper</text>
    <image href="B-tinted-paper.svg" xlink:href="B-tinted-paper.svg" x="154" y="58" width="180" height="180"/>
    <text x="24" y="274" fill="#6b6862" font-family="sans-serif" font-size="15">180px inspection</text>
    <image href="B-tinted-paper.svg" xlink:href="B-tinted-paper.svg" x="214" y="262" width="60" height="60"/>
    <text x="292" y="299" fill="#6b6862" font-family="sans-serif" font-size="15">60px sample</text>
  </g>
  <g transform="translate(548 104)">
    <rect width="488" height="350" rx="20" fill="#fffdf9" stroke="#d9d0be" stroke-width="2"/>
    <text x="24" y="38" fill="#2f2b26" font-family="sans-serif" font-size="19" font-weight="700">Requested · Reference-weight linework</text>
    <image href="B-tinted-paper-reference-weight-combined.svg" xlink:href="B-tinted-paper-reference-weight-combined.svg" x="154" y="58" width="180" height="180"/>
    <text x="24" y="274" fill="#6b6862" font-family="sans-serif" font-size="15">180px inspection</text>
    <image href="B-tinted-paper-reference-weight-combined.svg" xlink:href="B-tinted-paper-reference-weight-combined.svg" x="214" y="262" width="60" height="60"/>
    <text x="292" y="299" fill="#6b6862" font-family="sans-serif" font-size="15">60px sample</text>
  </g>
</svg>
